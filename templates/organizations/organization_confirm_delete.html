{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-xl-6 col-lg-7">
        <div class="card rounded-4 shadow-sm border-danger border-1">
            <div class="card-body p-5">
                <h1 class="h4 mb-3">Delete Organization</h1>
                <p class="text-muted mb-4">Are you sure you want to permanently delete <strong>{{ object.name }}</strong>? This action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex flex-column flex-sm-row gap-3">
                        <button class="btn btn-danger btn-pill px-4 py-2" type="submit">Confirm Delete</button>
                        <a class="btn btn-outline-indigo btn-pill px-4 py-2" href="{% url 'organization_list' %}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
