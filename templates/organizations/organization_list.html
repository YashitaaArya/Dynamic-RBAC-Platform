{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h2">Organizations</h1>
    <a class="btn btn-primary" href="{% url 'organization_create' %}">Create Organization</a>
</div>
<div class="table-responsive">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for organization in organizations %}
                <tr>
                    <td>{{ organization.name }}</td>
                    <td>{{ organization.description }}</td>
                    <td>
                        <a class="btn btn-sm btn-outline-secondary" href="{% url 'organization_update' organization.pk %}">Edit</a>
                        <a class="btn btn-sm btn-outline-danger" href="{% url 'organization_delete' organization.pk %}">Delete</a>
                    </td>
                </tr>
            {% empty %}
                <tr><td colspan="3">No organizations found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
