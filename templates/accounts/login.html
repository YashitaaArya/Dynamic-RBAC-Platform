{% extends 'base.html' %}

{% block content %}
<div class="login-hero">
    <div class="login-card">
        <div class="card rounded-4 shadow-lg border-0 overflow-hidden">
            <div class="card-body p-5">
                <div class="login-header">
                    <div class="lock-icon bg-soft rounded-circle shadow-sm">
                        <i class="bi bi-lock-fill fs-2 text-primary"></i>
                    </div>
                    <h1>Welcome back</h1>
                    <p>Securely access your RBAC console with tenant-aware authentication.</p>
                </div>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form.non_field_errors }}
                    <div class="row g-3 align-items-center mb-3">
                        <label for="id_username" class="col-sm-4 col-form-label text-sm-end">Username</label>
                        <div class="col-sm-8">
                            {{ form.username }}
                        </div>
                    </div>
                    <div class="row g-3 align-items-center mb-4">
                        <label for="id_password" class="col-sm-4 col-form-label text-sm-end">Password</label>
                        <div class="col-sm-8">
                            {{ form.password }}
                        </div>
                    </div>
                    <button class="btn btn-indigo btn-pill w-100 py-2" type="submit">Login</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
