{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-xl-7 col-lg-8">
        <div class="card rounded-4 shadow-sm">
            <div class="card-body p-5">
                <div class="mb-4">
                    <h1 class="h4 mb-1">{{ title }}</h1>
                    <p class="page-subtitle mb-0">Provide user information and assign the appropriate role.</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex flex-column flex-sm-row gap-3 mt-4 form-actions">
                        <button class="btn btn-indigo btn-pill px-4 py-2" type="submit">Save</button>
                        <a class="btn btn-outline-indigo btn-pill px-4 py-2" href="{% url 'user_list' %}">Back</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
