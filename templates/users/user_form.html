{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">{{ title }}</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary" type="submit">Save</button>
                    <a class="btn btn-secondary" href="{% url 'user_list' %}">Back</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
