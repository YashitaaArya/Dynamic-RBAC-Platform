{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="h2">Features</h1>
        <p class="text-muted">All available system features and codes.</p>
    </div>
</div>
<div class="table-responsive">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Code</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            {% for feature in features %}
                <tr>
                    <td>{{ feature.name }}</td>
                    <td>{{ feature.code }}</td>
                    <td>{{ feature.description }}</td>
                </tr>
            {% empty %}
                <tr><td colspan="3">No features found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
